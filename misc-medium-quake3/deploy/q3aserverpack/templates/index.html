<!DOCTYPE html>

<html lang="ru">
<head>
<meta charset="UTF-8">
<title>MEAT SERVER // QUAKE III ARENA</title>

<style>
body {
    background: #000;
    color: #00ff00;
    font-family: "Courier New", monospace;
    text-align: center;
    margin: 0;
    padding: 0;
}

.container {
    margin-top: 80px;
}

h1 {
    font-size: 72px;
    color: #ff0000;
    text-shadow: 0 0 10px #ff0000;
    margin-bottom: 10px;
}

.subtitle {
    color: #ffff00;
    font-size: 20px;
    margin-bottom: 40px;
}

.box {
    border: 2px dashed #00ff00;
    display: inline-block;
    padding: 20px 40px;
    text-align: left;
}

.box p {
    margin: 5px 0;
}

.connect {
    margin-top: 50px;
    font-size: 22px;
    color: #00ffff;
}

.connect span {
    color: #ffffff;
    background: #222;
    padding: 5px 10px;
    border: 1px solid #00ffff;
}

.footer {
    margin-top: 80px;
    font-size: 12px;
    color: #444;
}

.blink {
    animation: blink 1s steps(2, start) infinite;
}

@keyframes blink {
    to {
        visibility: hidden;
    }
}
</style>

</head>

<body>

<div class="container">

<h1>MEAT SERVER</h1>

<div class="subtitle">
[ NO RULES // NO MODS // PURE FRAGGING // DEFAULT SETTINGS ]
</div>

<div class="box">
<p>> Quake III Arena</p>
<p>> Vanilla gameplay</p>
<p>> DEFAULT SETTINGS</p>
<p>> Blood. Speed. Skill.</p>
</div>

<div class="connect">
<span class="blink">>> CONNECT NOW:</span><br><br>
<span>{{HOST}}:{{GAMEPORT}}</span>
</div>

<div class="footer">
<p>powered by ioquake3</p>
</div>

</div>

</body>
</html>

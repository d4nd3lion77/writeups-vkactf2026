{% extends "base.html" %}

{% block content %}
<style>
  body {
    background: url('/themes/core/static/img/tasks3.png') center center / cover no-repeat fixed;
  }

  .page-bg {
    min-height: 100vh;
    padding-bottom: 50px;
  }

  .hero-header {
    min-height: 220px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
  }

  .hero-header h1 {
    color: #0057ff;
    font-size: 3.5rem;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 3px;
    margin: 0;
    text-shadow:
      0 2px 10px rgba(255,255,255,.8),
      0 4px 20px rgba(0,87,255,.15);
  }

  .category-tile {
    background: #ffffff;
    border-radius: 12px;
    padding: 15px;
    margin-bottom: 8px;
    box-shadow: 0 10px 35px rgba(0, 0, 0, 0.18);
  }

  .category-header h3 {
    color: #304e86;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 2px;
    margin-bottom: 20px;
    border-bottom: 2px solid rgba(48, 78, 134, 0.15);
    padding-bottom: 12px;
  }

  .challenge-button {
    background: linear-gradient(
      135deg,
      #0257A9 0%,
      #073570 55%,
      #021f4d 100%
    ) !important;

    border: none !important;
    color: #fff !important;
    border-radius: 14px;
    transition: all .25s ease;
    box-shadow:
      0 8px 20px rgba(0,87,255,.25),
      inset 0 1px 0 rgba(255,255,255,.15);

    min-height: 110px;
  }

  .challenge-button:hover {
    transform: translateY(-4px);

    background: linear-gradient(
      135deg,
      #1a6cff 0%,
      #0b4ebd 55%,
      #073570 100%
    ) !important;

    box-shadow:
      0 14px 28px rgba(0,87,255,.35),
      inset 0 1px 0 rgba(255,255,255,.2);
  }

  .challenge-button:focus {
    box-shadow:
      0 0 0 0.25rem rgba(0,87,255,.25),
      0 12px 24px rgba(0,87,255,.35) !important;
  }

  .challenge-solved {
    background: linear-gradient(
      135deg,
      #7ef0a5 0%,
      #64da86 50%,
      #2cbf63 100%
    ) !important;

    box-shadow:
      0 8px 20px rgba(34,197,94,.25),
      inset 0 1px 0 rgba(255,255,255,.15);
  }

  .challenge-solved:hover {
    background: linear-gradient(
      135deg,
      #92f4b3 0%,
      #6fe390 50%,
      #38c96d 100%
    ) !important;
  }

  .challenge-inner {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 8px;
  }

  .challenge-inner p,
  .challenge-inner span {
    color: #fff;
    margin: 0;
  }

  .challenge-inner p {
    font-weight: 700;
    font-size: 1rem;
  }

  .challenge-inner span {
    opacity: .95;
  }
  .sprite-left,
  .sprite-right {
    position: fixed;
    bottom: 0;
    z-index: 5;
    pointer-events: none;
  }

  .sprite-left {
    left: -450px;
    bottom: -150px;
  }

  .sprite-right {
    right: -250px;
    bottom: -170px;
  }

  .sprite-left img,
  .sprite-right img {
    width: 1300px;
    height: auto;
  }

  @media (max-width: 1200px) {
    .sprite-left img,
    .sprite-right img {
      width: 180px;
    }
  }

  @media (max-width: 768px) {
    .sprite-left,
    .sprite-right {
      display: none;
    }
  }
</style>

<div class="page-bg">

  <div class="hero-header">
  <div class="container text-center">
    <h1>{% trans %}Задания{% endtrans %}</h1>
  </div>
</div>

  <div class="container">

    <div class="row">
      <div class="col-md-12">
        {% include "components/errors.html" %}
      </div>
    </div>

    <div
      x-data="ChallengeBoard"
      @load-challenges.window="loadChallenges()"
      @load-challenge.window="loadChallenge($event.detail)"
    >

      <div
        x-ref="challengeWindow"
        id="challenge-window"
        class="modal fade"
        tabindex="-1"
        role="dialog"
        x-data=""
        x-html="$store.challenge.data.view"
      ></div>

      <div x-show="!loaded">
        <div class="min-vh-50 d-flex align-items-center">
          <div class="text-center w-100">
            <i class="fas fa-circle-notch fa-spin fa-3x fa-fw spinner text-white"></i>
          </div>
        </div>
      </div>

      <div x-show="loaded">
        <template x-for="(category, idx) in getCategories()" :key="idx">
          <div class="category-tile">

            <div class="category-header">
              <h3 x-text="category"></h3>
            </div>

            <div class="row">
              <template x-for="(c, idx) in getChallenges(category)" :key="c.id">
                <div class="col-sm-6 col-md-4 col-lg-3 mb-4">

                  <button
                    class="challenge-button btn w-100 h-100"
                    :class="[
                      c.solved_by_me ? 'challenge-solved' : '',
                      ...c.tags.map((tag) => `tag-${tag.value.replace(/ /g, '-')}`)
                    ]"
                    :value="c.id"
                    @click="loadChallenge(c.id)"
                  >

                    <div class="challenge-inner">
                      <p x-text="c.name"></p>

                      <span>
                        <i class="fas fa-flag"></i>
                        <span x-text="c.value"></span>
                      </span>
                    </div>

                  </button>

                </div>
              </template>
            </div>

          </div>
        </template>
      </div>

    </div>

  </div>

</div>
<div class="sprite-left">
  <img
    src="/themes/core/static/img/sprite_left.png"
    alt="Left Sprite"
  >
</div>

<div class="sprite-right">
  <img
    src="/themes/core/static/img/sprite_right.png"
    alt="Right Sprite"
  >
</div>
{% endblock %}

{% block scripts %}
  {{ Assets.js("assets/js/challenges.js") }}
{% endblock %}

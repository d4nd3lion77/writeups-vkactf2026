version: '3.8'

services:

  nginx:
    image: nginx:alpine
    ports:
      - "31200:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./src:/var/www/html
    restart: unless-stopped
    networks:
      - 1xvka
    deploy:
      resources:
        limits:
          cpus: '1.5' 
          memory: 3G 

  php:
    build:
      context: .
      dockerfile: php/Dockerfile
    env_file: .env
    volumes:
      - ./src:/var/www/html
      - ./.env:/var/www/.env:ro
    restart: unless-stopped
    networks:
      - 1xvka

  mysql:
    image: mysql:8.0
    env_file: .env
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped
    networks:
      - 1xvka

  cron:
    build:
      context: .
      dockerfile: php/Dockerfile
    env_file: .env
    volumes:
      - ./src:/var/www/html
      - ./.env:/var/www/.env:ro
    command: php /var/www/html/cron/settle_bets.php
    restart: unless-stopped
    networks:
      - 1xvka

volumes:
  mysql_data:

networks:
  1xvka:
    driver: bridge

version: "3.9"

services:
  nginx:
    image: nginx:1.25-alpine
    ports:
      - "31002:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./src:/var/www/html:ro
    depends_on:
      - php
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 2G

  php:
    build: ./php
    volumes:
      - ./src:/var/www/html
    env_file:
      - .env
    restart: unless-stopped
